<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>hs번역웹</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#ffffff;
  color:#111;
}

header{
  width:100%;
  height:75px;
  border-bottom:2px solid #e5e5e5;
  display:flex;
  align-items:center;
  padding:0 20px;
  background:white;
}

.logo{
  font-size:32px;
  font-weight:900;
  color:#00c73c;
}

.wrap{
  width:100%;
  max-width:1400px;
  margin:auto;
  padding:25px;
}

.title{
  font-size:50px;
  font-weight:900;
  margin-bottom:10px;
}

.sub{
  color:#666;
  margin-bottom:30px;
  font-size:18px;
}

.boxes{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:20px;
  align-items:center;
}

.box{
  border:2px solid #ddd;
  background:white;
  min-height:500px;
  padding:20px;
  border-radius:18px;
}

.top{
  margin-bottom:20px;
}

select{
  width:100%;
  padding:16px;
  border:2px solid #ddd;
  background:#f8f8f8;
  font-size:17px;
  font-weight:bold;
  border-radius:12px;
  outline:none;
}

textarea{
  width:100%;
  height:380px;
  border:none;
  outline:none;
  resize:none;
  font-size:22px;
  line-height:1.6;
}

.middle{
  display:flex;
  justify-content:center;
  align-items:center;
}

.swap{
  width:90px;
  height:90px;
  border:none;
  border-radius:50%;
  background:#00c73c;
  color:white;
  font-size:40px;
  cursor:pointer;
  transition:0.2s;
}

.swap:hover{
  transform:rotate(180deg);
}

.buttons{
  margin-top:25px;
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.btn{
  flex:1;
  min-width:200px;
  padding:18px;
  border:none;
  border-radius:14px;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
}

.translate{
  background:#00c73c;
  color:white;
}

.copy{
  background:#111;
  color:white;
}

.site{
  margin-top:25px;
  border:2px solid #ddd;
  background:#f8f8f8;
  padding:18px;
  border-radius:14px;
  font-size:16px;
  word-break:break-all;
}

.status{
  margin-top:15px;
  font-size:15px;
  color:#666;
}

@media(max-width:1000px){

  .boxes{
    grid-template-columns:1fr;
  }

  .middle{
    transform:rotate(90deg);
  }

  textarea{
    height:250px;
  }
}

@media(max-width:600px){

  .wrap{
    padding:15px;
  }

  .title{
    font-size:35px;
  }

  textarea{
    font-size:18px;
  }

  .btn{
    width:100%;
    flex:none;
  }

  .swap{
    width:75px;
    height:75px;
    font-size:30px;
  }
}

</style>
</head>

<body>

<header>

<div class="logo">
hs번역웹
</div>

</header>

<div class="wrap">

<div class="title">
hs번역웹
</div>

<div class="sub">
무료 AI 번역 웹사이트
</div>

<div class="boxes">

<!-- 입력 -->
<div class="box">

<div class="top">

<select id="from">
<option value="ko">🇰🇷 한국어</option>
<option value="en">🇺🇸 영어</option>
<option value="ja">🇯🇵 일본어</option>
<option value="zh">🇨🇳 중국어</option>
<option value="fr">🇫🇷 프랑스어</option>
<option value="de">🇩🇪 독일어</option>
<option value="es">🇪🇸 스페인어</option>
<option value="ru">🇷🇺 러시아어</option>
<option value="it">🇮🇹 이탈리아어</option>
<option value="th">🇹🇭 태국어</option>
</select>

</div>

<textarea
id="input"
placeholder="번역할 내용을 입력하세요"
></textarea>

</div>

<!-- 가운데 -->
<div class="middle">

<button
class="swap"
onclick="swapLang()"
>
⇄
</button>

</div>

<!-- 결과 -->
<div class="box">

<div class="top">

<select id="to">
<option value="en">🇺🇸 영어</option>
<option value="ko">🇰🇷 한국어</option>
<option value="ja">🇯🇵 일본어</option>
<option value="zh">🇨🇳 중국어</option>
<option value="fr">🇫🇷 프랑스어</option>
<option value="de">🇩🇪 독일어</option>
<option value="es">🇪🇸 스페인어</option>
<option value="ru">🇷🇺 러시아어</option>
<option value="it">🇮🇹 이탈리아어</option>
<option value="th">🇹🇭 태국어</option>
</select>

</div>

<textarea
id="output"
readonly
placeholder="번역 결과가 표시됩니다"
></textarea>

</div>

</div>

<div class="buttons">

<button
id="translateBtn"
class="btn translate"
onclick="translateText()"
>
번역하기
</button>

<button
class="btn copy"
onclick="copyText()"
>
복사하기
</button>

</div>

<div class="status" id="status">
준비 완료
</div>

<div class="site">

🌐 내 웹사이트 주소<br><br>

https://hongtaegeongaebalja.github.io/hs-/

</div>

</div>

<script>

// 잘못된 부분 수정:
// 무료 번역 서버들이 차단되거나 횟수 제한 때문에 오류남
// 그래서 서버 여러개 자동 시도 방식으로 수정

const servers = [
  "https://translate.astian.org/translate",
  "https://libretranslate.com/translate",
  "https://translate.argosopentech.com/translate"
];

function swapLang(){

  const from =
    document.getElementById("from");

  const to =
    document.getElementById("to");

  const temp = from.value;

  from.value = to.value;
  to.value = temp;

  const input =
    document.getElementById("input");

  const output =
    document.getElementById("output");

  const tempText = input.value;

  input.value = output.value;
  output.value = tempText;
}

async function tryTranslate(url,text,from,to){

  const response = await fetch(url,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      q:text,
      source:from,
      target:to,
      format:"text"
    })
  });

  if(!response.ok){

    throw new Error("서버 실패");
  }

  return await response.json();
}

async function translateText(){

  const input =
    document.getElementById("input");

  const output =
    document.getElementById("output");

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("translateBtn");

  const text =
    input.value.trim();

  if(text === ""){

    alert("내용 입력");
    return;
  }

  const from =
    document.getElementById("from").value;

  const to =
    document.getElementById("to").value;

  if(from === to){

    output.value = text;
    return;
  }

  button.disabled = true;

  output.value = "번역중...";
  status.innerText = "서버 연결중...";

  let translated = false;

  for(let i=0;i<servers.length;i++){

    try{

      status.innerText =
        "서버 시도중 " + (i+1);

      const data =
        await tryTranslate(
          servers[i],
          text,
          from,
          to
        );

      if(data.translatedText){

        output.value =
          data.translatedText;

        status.innerText =
          "번역 완료";

        translated = true;

        break;
      }

    }catch(error){

      console.log(
        "서버 실패:",
        servers[i]
      );
    }
  }

  if(!translated){

    output.value =
      "현재 번역 서버 사용량 많음";

    status.innerText =
      "잠시 후 다시 시도";
  }

  button.disabled = false;
}

function copyText(){

  const text =
    document.getElementById("output").value;

  if(text.trim() === ""){

    alert("복사할 내용 없음");
    return;
  }

  navigator.clipboard.writeText(text);

  alert("복사 완료");
}

</script>

</body>
</html>
