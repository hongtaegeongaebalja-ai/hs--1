<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>hs번역웹</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#ffffff;
  color:#111;
}

/* 상단 */
header{
  width:100%;
  height:75px;
  border-bottom:2px solid #e5e5e5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:white;
}

.logo{
  font-size:32px;
  font-weight:900;
  color:#00c73c;
}

/* 전체 */
.wrap{
  width:100%;
  max-width:1400px;
  margin:auto;
  padding:25px;
}

.title{
  font-size:50px;
  font-weight:900;
  margin-bottom:10px;
}

.sub{
  color:#666;
  margin-bottom:30px;
  font-size:18px;
}

/* 번역 영역 */
.boxes{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:20px;
  align-items:center;
}

/* 카드 */
.box{
  border:2px solid #dddddd;
  background:white;
  min-height:500px;
  padding:20px;
}

/* 언어 선택 */
.top{
  margin-bottom:20px;
}

select{
  width:100%;
  padding:16px;
  border:2px solid #dddddd;
  background:#f8f8f8;
  font-size:17px;
  font-weight:bold;
  outline:none;
}

/* 텍스트 */
textarea{
  width:100%;
  height:380px;
  border:none;
  outline:none;
  resize:none;
  font-size:22px;
  line-height:1.6;
}

/* 가운데 버튼 */
.middle{
  display:flex;
  justify-content:center;
  align-items:center;
}

.swap{
  width:90px;
  height:90px;
  border:none;
  background:#00c73c;
  color:white;
  font-size:40px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

.swap:hover{
  transform:rotate(180deg) scale(1.1);
  background:#00a832;
}

/* 버튼 */
.buttons{
  margin-top:25px;
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.btn{
  flex:1;
  min-width:200px;
  padding:18px;
  border:none;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
}

.translate{
  background:#00c73c;
  color:white;
}

.copy{
  background:#111;
  color:white;
}

/* 주소 */
.site{
  margin-top:25px;
  border:2px solid #dddddd;
  background:#f8f8f8;
  padding:18px;
  font-size:16px;
  word-break:break-all;
}

/* 반응형 */
@media(max-width:1000px){

  .boxes{
    grid-template-columns:1fr;
  }

  .middle{
    transform:rotate(90deg);
  }

  textarea{
    height:250px;
  }
}

@media(max-width:600px){

  .wrap{
    padding:15px;
  }

  .title{
    font-size:35px;
  }

  textarea{
    font-size:18px;
  }

  .btn{
    width:100%;
    flex:none;
  }

  .swap{
    width:75px;
    height:75px;
    font-size:30px;
  }
}

</style>
</head>

<body>

<header>

<div class="logo">
hs번역웹
</div>

</header>

<div class="wrap">

<div class="title">
hs번역웹
</div>

<div class="sub">
무료 AI 번역 웹사이트
</div>

<div class="boxes">

<!-- 입력 -->
<div class="box">

<div class="top">

<select id="from">

<option value="ko">🇰🇷 한국어</option>
<option value="en">🇺🇸 영어</option>
<option value="ja">🇯🇵 일본어</option>
<option value="zh-CN">🇨🇳 중국어</option>
<option value="fr">🇫🇷 프랑스어</option>
<option value="de">🇩🇪 독일어</option>
<option value="es">🇪🇸 스페인어</option>
<option value="ru">🇷🇺 러시아어</option>
<option value="it">🇮🇹 이탈리아어</option>
<option value="th">🇹🇭 태국어</option>

</select>

</div>

<textarea
id="input"
placeholder="번역할 내용을 입력하세요"
></textarea>

</div>

<!-- 가운데 -->
<div class="middle">

<button
class="swap"
onclick="swapLang()"
>
⇄
</button>

</div>

<!-- 결과 -->
<div class="box">

<div class="top">

<select id="to">

<option value="en">🇺🇸 영어</option>
<option value="ko">🇰🇷 한국어</option>
<option value="ja">🇯🇵 일본어</option>
<option value="zh-CN">🇨🇳 중국어</option>
<option value="fr">🇫🇷 프랑스어</option>
<option value="de">🇩🇪 독일어</option>
<option value="es">🇪🇸 스페인어</option>
<option value="ru">🇷🇺 러시아어</option>
<option value="it">🇮🇹 이탈리아어</option>
<option value="th">🇹🇭 태국어</option>

</select>

</div>

<textarea
id="output"
readonly
placeholder="번역 결과가 표시됩니다"
></textarea>

</div>

</div>

<!-- 버튼 -->
<div class="buttons">

<button
class="btn translate"
onclick="translateText()"
>
번역하기
</button>

<button
class="btn copy"
onclick="copyText()"
>
복사하기
</button>

</div>

<!-- 사이트 주소 -->
<div class="site">

🌐 내 웹사이트 주소<br><br>

https://hongtaegeongaebalja.github.io/hs-/

</div>

</div>

<script>

// 언어 변경
function swapLang(){

  let from =
    document.getElementById("from");

  let to =
    document.getElementById("to");

  let temp = from.value;

  from.value = to.value;
  to.value = temp;

  let input =
    document.getElementById("input");

  let output =
    document.getElementById("output");

  let tempText = input.value;

  input.value = output.value;
  output.value = tempText;
}

// 번역
async function translateText(){

  let text =
    document.getElementById("input").value;

  if(text.trim() === ""){

    alert("내용 입력");

    return;
  }

  let from =
    document.getElementById("from").value;

  let to =
    document.getElementById("to").value;

  let output =
    document.getElementById("output");

  output.value = "번역중...";

  try{

    const response = await fetch(
      `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`
    );

    const data =
      await response.json();

    output.value =
      data.responseData.translatedText;

  }catch(error){

    console.log(error);

    output.value =
      "번역 실패";

  }
}

// 복사
function copyText(){

  let text =
    document.getElementById("output");

  text.select();

  document.execCommand("copy");

  alert("복사 완료");
}

</script>

</body>
</html>
